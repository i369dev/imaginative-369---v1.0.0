<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>imaginative 369</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0a;
      }
      .font-logo {
        font-family: 'UnifrakturMaguntia', cursive;
      }
      .perspective-container {
        perspective: 1500px;
      }
      .glass-card {
        background: rgba(17, 25, 40, 0.75);
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.125);
        position: relative; /* Needed for pseudo-element */
      }
      .glass-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: radial-gradient(
            circle 250px at var(--mouse-x, -300px) var(--mouse-y, -300px),
            rgba(34, 211, 238, 0.15),
            transparent 80%
        );
        border-radius: inherit;
        opacity: 0;
        transition: opacity 0.4s ease-out;
        pointer-events: none;
      }
      .glass-card:hover::before {
          opacity: 1;
      }
      /* Custom scrollbar for webkit browsers */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(30, 41, 59, 0.5); /* neutral-800 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(74, 222, 128, 0.4); /* green-400 */
        background: rgba(34, 211, 238, 0.5); /* cyan-400 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(34, 211, 238, 0.7); /* cyan-400 */
      }
      /* For Live Activity Feed */
      .activity-item {
        animation: slideIn 0.5s ease-out forwards;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      /* Styles for Process Flow Chart */
      .flow-branch {
        --branch-color: #9333ea; /* purple-600 */
        position: relative;
        padding-left: 40px; /* Space for the line and elbow */
      }
      .flow-branch::after {
        content: '';
        position: absolute;
        left: -20px; /* Position it relative to the parent column's line */
        top: 0;
        width: 2px;
        height: 100%;
        background-color: var(--branch-color);
      }
      .flow-branch:first-child::after { top: 50%; height: 50%; }
      .flow-branch:last-child::after { height: 50%; }
      .flow-branch:only-child::after { display: none; }
      .flow-branch > *:first-child {
        position: relative;
      }
      .flow-branch > *:first-child::before {
        content: '';
        position: absolute;
        left: -20px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 2px;
        background-color: var(--branch-color);
      }
      .flow-details-column {
          position: relative;
          padding-left: 40px;
          margin-top: 1rem;
      }
      .flow-details-column::before {
          content: '';
          position: absolute;
          left: 0;
          top: 0;
          width: 2px;
          height: 100%;
          background-color: #4b5563; /* gray-600 */
      }
      .flow-detail-node {
        position: relative;
        padding-left: 24px;
      }
      .flow-detail-node::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 24px;
        height: 2px;
        background-color: #4b5563; /* gray-600 */
      }
      /* Blinking animation for attendance cards */
      @keyframes blink-green {
        0%, 100% { box-shadow: 0 0 0px rgba(16, 185, 129, 0); }
        50% { box-shadow: 0 0 12px 3px rgba(16, 185, 129, 0.8); }
      }
      .animate-blink-green {
        animation: blink-green 2.5s infinite ease-in-out;
      }

      @keyframes blink-red {
        0%, 100% { box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
        50% { box-shadow: 0 0 12px 3px rgba(239, 68, 68, 0.7); }
      }
      .animate-blink-red {
        animation: blink-red 3s infinite ease-in-out;
      }

      @keyframes blink-yellow {
        0%, 100% { box-shadow: 0 0 0px rgba(245, 158, 11, 0); }
        50% { box-shadow: 0 0 12px 3px rgba(245, 158, 11, 0.8); }
      }
      .animate-blink-yellow {
        animation: blink-yellow 2.5s infinite ease-in-out;
      }

      /* New animation for save confirmation toast */
      @keyframes fade-in-out {
          0% { opacity: 0; transform: translateY(-10px); }
          15% { opacity: 1; transform: translateY(0); }
          85% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-10px); }
      }
      .animate-fade-in-out {
          animation: fade-in-out 3s ease-in-out forwards;
      }

      /* New animation for logo float */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      /* New shadow for floating logo */
      .logo-shadow {
        margin: 0 auto;
        width: 60%;
        max-width: 180px;
        height: 10px;
        background: rgba(34, 211, 238, 0.25);
        border-radius: 50%;
        filter: blur(8px);
        transform-origin: center;
      }
      
      @keyframes float-shadow {
        0% {
          transform: scale(1);
          opacity: 0.4;
          filter: blur(10px);
        }
        50% {
          transform: scale(0.85);
          opacity: 0.2;
          filter: blur(20px);
        }
        75% {
          transform: scale(0.925);
          opacity: 0.5;
          filter: blur(12px);
        }
        100% {
          transform: scale(1);
          opacity: 0.4;
          filter: blur(10px);
        }
      }

      .animate-float-shadow {
        animation: float-shadow 6s ease-in-out infinite;
      }
    </style>
